<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend_monitoreo</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif;">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem; border-radius: 1.5rem; background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02); max-width: 24rem; width: 90%; text-align: center;">
          
          <!-- Animated Spinner Rings -->
          <div style="position: relative; width: 6rem; height: 6rem; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
            <!-- Outer Ring - Indigo & Violet gradient spin -->
            <div style="position: absolute; inset: 0; border-radius: 9999px; border: 4px solid transparent; border-top-color: #4f46e5; border-right-color: #8b5cf6; animation: loader-spin 1s linear infinite;"></div>
            
            <!-- Inner Ring - Pink & Purple gradient reverse spin -->
            <div style="position: absolute; inset: 0.5rem; border-radius: 9999px; border: 4px solid transparent; border-bottom-color: #ec4899; border-left-color: #a855f7; animation: loader-spin-reverse 1.5s linear infinite;"></div>
            
            <!-- Pulsing Center Core -->
            <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%); border-radius: 9999px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); animation: loader-pulse 2s infinite;">
              <svg style="width: 1.5rem; height: 1.5rem; color: #4f46e5; filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <!-- Activity / Pulse line -->
                <path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
              </svg>
            </div>
          </div>
          
          <!-- Message text -->
          <p style="font-size: 0.875rem; font-weight: 600; color: #4f46e5; letter-spacing: 0.05em; margin: 0; animation: loader-pulse 1.5s infinite;">
            INICIALIZANDO IOT MONITOR
          </p>
          
          <!-- Bounce Dots -->
          <div style="display: flex; justify-content: center; gap: 0.375rem; margin-top: 0.5rem;">
            <div style="width: 0.375rem; height: 0.375rem; background-color: #6366f1; border-radius: 9999px; animation: loader-bounce 1.4s infinite ease-in-out both; animation-delay: -0.32s;"></div>
            <div style="width: 0.375rem; height: 0.375rem; background-color: #8b5cf6; border-radius: 9999px; animation: loader-bounce 1.4s infinite ease-in-out both; animation-delay: -0.16s;"></div>
            <div style="width: 0.375rem; height: 0.375rem; background-color: #ec4899; border-radius: 9999px; animation: loader-bounce 1.4s infinite ease-in-out both;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes loader-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes loader-spin-reverse {
          to { transform: rotate(-360deg); }
        }
        @keyframes loader-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.6; transform: scale(0.95); }
        }
        @keyframes loader-bounce {
          0%, 80%, 100% { transform: scale(0); }
          40% { transform: scale(1.0); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
